name: Android test build

# Manual only. Builds a debug-signed APK and attaches it to the run as a download,
# so it can be tried on a phone. It does not touch any release.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Point the build at the NDK that GitHub's machines include
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Install the Tauri packager
        run: cargo install tauri-cli --version "^2" --locked

      - name: Create the Android project
        working-directory: src-tauri
        run: cargo tauri android init --ci

      - name: Build the APK
        working-directory: src-tauri
        run: cargo tauri android build --apk --target aarch64 --debug --ci

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: Hopper-Launcher-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
