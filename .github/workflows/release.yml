name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach files to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      APPIMAGE_EXTRACT_AND_RUN: 1
      NO_STRIP: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install the Tauri packager
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the AppImage
        working-directory: src-tauri
        run: cargo tauri build --bundles appimage

      - name: Name the files and write checksums
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/appimage/*.AppImage "out/Hopper-Launcher-${TAG#v}-x86_64.AppImage"
          cd out && sha256sum *.AppImage > SHA256SUMS

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: true
          files: |
            out/*.AppImage
            out/SHA256SUMS

  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install the Tauri packager
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the installer
        working-directory: src-tauri
        run: cargo tauri build --bundles nsis

      - name: Name the files and write checksums
        run: |
          VER="${TAG#v}"
          mkdir out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "out/Hopper-Launcher-Setup-${VER}-x64.exe"
          (cd src-tauri/target/release && 7z a -tzip "$GITHUB_WORKSPACE/out/Hopper-Launcher-${VER}-windows-x64.zip" hopper-launcher.exe)
          cd out && sha256sum *.exe *.zip > SHA256SUMS-windows

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: true
          files: |
            out/*.exe
            out/*.zip
            out/SHA256SUMS-windows
