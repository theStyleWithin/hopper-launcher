name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach files to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      APPIMAGE_EXTRACT_AND_RUN: 1
      NO_STRIP: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install the Tauri packager
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the AppImage
        working-directory: src-tauri
        run: cargo tauri build --bundles appimage

      - name: Name the files and write checksums
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/appimage/*.AppImage "out/Hopper-Launcher-${TAG#v}-x86_64.AppImage"
          cd out && sha256sum *.AppImage > SHA256SUMS

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: false
          files: |
            out/*.AppImage
            out/SHA256SUMS

  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install the Tauri packager
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the installer
        working-directory: src-tauri
        run: cargo tauri build --bundles nsis

      - name: Name the files and write checksums
        run: |
          VER="${TAG#v}"
          mkdir out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "out/Hopper-Launcher-Setup-${VER}-x64.exe"
          (cd src-tauri/target/release && 7z a -tzip "$GITHUB_WORKSPACE/out/Hopper-Launcher-${VER}-windows-x64.zip" hopper-launcher.exe)
          cd out && sha256sum *.exe *.zip > SHA256SUMS-windows

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: false
          files: |
            out/*.exe
            out/*.zip
            out/SHA256SUMS-windows

  android:
    # Never blocks the Linux and Windows files: if signing is not set up or the build fails, this job just stops.
    runs-on: ubuntu-22.04
    continue-on-error: true
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Is signing set up?
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::The Android signing secrets are not set (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD), so no Android file was built. See ANDROID.md."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Point the build at the NDK that GitHub's machines include
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Install the Tauri packager
        run: cargo install tauri-cli --version "^2" --locked

      - name: Create the Android project
        working-directory: src-tauri
        run: cargo tauri android init --ci

      - name: Build the APK (tries up to three times; the download servers are sometimes busy)
        working-directory: src-tauri
        run: |
          for attempt in 1 2 3; do
            cargo tauri android build --apk --target aarch64 --ci && exit 0
            echo "Attempt $attempt failed; trying again."
            sleep 20
          done
          exit 1

      - name: Align, sign and name the APK, then write its checksum
        run: |
          VER="${TAG#v}"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="$(find src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' | head -1)"
          test -n "$UNSIGNED" || { echo "::error::No release APK was produced"; exit 1; }
          mkdir out
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "out/Hopper-Launcher-${VER}-android-arm64.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "out/Hopper-Launcher-${VER}-android-arm64.apk"
          rm -f "$RUNNER_TEMP/release.jks"
          cd out && sha256sum *.apk > SHA256SUMS-android

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: false
          files: |
            out/*.apk
            out/SHA256SUMS-android
