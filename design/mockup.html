<!doctype html>
<html lang="en" data-theme="cyberpunk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hopper Launcher: design mockup</title>
<style>
/* ---------- Themes: every colour in the UI comes from these tokens ---------- */
:root, [data-theme="cyberpunk"] {
  --bg: #0d0f1a; --panel: #151829; --panel-hi: #1b1f35; --line: #2a2f4d;
  --text: #e6e9ff; --dim: #9aa2c8; --accent: #19e3ff; --accent-ink: #00141a;
  --warn: #ffb02e; --ok: #2ee6a6;
}
[data-theme="midnight"] {
  --bg: #10151c; --panel: #171e28; --panel-hi: #1d2633; --line: #2b3646;
  --text: #e8edf3; --dim: #9aa8b8; --accent: #6ea8fe; --accent-ink: #06121f;
  --warn: #f0b84a; --ok: #5fd39a;
}
[data-theme="paper"] {
  --bg: #f4f1ea; --panel: #fffdf8; --panel-hi: #f0ece2; --line: #d8d2c4;
  --text: #1b1b1f; --dim: #5d5b57; --accent: #0b6e8a; --accent-ink: #ffffff;
  --warn: #9a5b00; --ok: #17724f;
}

/* ---------- Layout: one 8px grid, nothing off-grid, nothing moves ---------- */
* { box-sizing: border-box; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/24px system-ui, "Segoe UI", sans-serif;
  padding: 32px; max-width: 1120px; margin: 0 auto;
}
header { display: flex; justify-content: space-between; align-items: center; min-height: 64px; flex-wrap: wrap; gap: 16px; }
h1 { font-size: 32px; line-height: 40px; font-weight: 300; letter-spacing: 2px; text-transform: lowercase; }
h1 b { font-weight: 700; color: var(--accent); }
.controls { display: flex; gap: 16px; flex-wrap: wrap; }
input[type=color] { width: 56px; height: 40px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
input[type=color]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pair { display: flex; gap: 8px; }
label { font-size: 12px; line-height: 16px; color: var(--dim); display: block; text-transform: uppercase; letter-spacing: 1px; }
select, button {
  font: inherit; font-size: 14px; height: 40px; padding: 0 16px;
  background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 4px;
}
select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.device {
  margin: 24px 0; padding: 16px 24px; height: 72px;
  background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent);
  border-radius: 4px; display: flex; justify-content: space-between; align-items: center;
}
.device strong { display: block; }
.device span { color: var(--dim); font-size: 14px; }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 880px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .grid { grid-template-columns: 1fr; } body { padding: 16px; } }

.tile {
  height: 208px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between;
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
}
.tile:not(.off):hover { background: var(--panel-hi); }
.tile h2 { font-size: 20px; line-height: 24px; font-weight: 600; }
.tile .tag { color: var(--dim); font-size: 14px; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { display: inline-block; font-size: 12px; line-height: 16px; padding: 4px 8px; border: 1px solid currentColor; border-radius: 2px; }
.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.no { color: var(--dim); }
.row { display: flex; flex-direction: column; align-items: stretch; gap: 16px; }
.row select { width: 100%; }
.row select:disabled { color: var(--dim); }
.go { background: var(--accent); color: var(--accent-ink); border: 0; font-weight: 600; width: 100%; }
.go[disabled] { background: transparent; color: var(--dim); border: 1px solid var(--line); font-weight: 400; }
footer { margin-top: 24px; color: var(--dim); font-size: 12px; line-height: 16px; min-height: 16px; }
#hint { color: var(--warn); }

/* Cyberpunk flavour without noise: a single thin accent line, no glow or flicker. */
[data-theme="cyberpunk"] header { border-bottom: 1px solid var(--accent); }
@media (prefers-reduced-motion: no-preference) { .tile, .go { transition: background .15s; } }
</style>
</head>
<body>
<header>
  <h1>hopper<b>launcher</b></h1>
  <div class="controls">
    <div><label for="theme">Theme</label>
      <select id="theme"><option value="cyberpunk">Cyberpunk</option><option value="midnight">Midnight</option><option value="paper">Paper (light)</option></select></div>
    <div><label for="accent">Accent</label>
      <div class="pair"><input type="color" id="accent" value="#19e3ff" aria-label="Accent colour"><button id="reset" type="button">Reset</button></div></div>
    <div><label for="dev">Simulate device</label>
      <select id="dev"><option value="windows">Windows PC</option><option value="linux" selected>Linux PC</option><option value="android">Android phone</option><option value="arm">Linux ARM board</option></select></div>
  </div>
</header>

<section class="device" aria-live="polite"><div><strong id="devname"></strong><span id="devspec"></span></div><span id="devnote"></span></section>
<main class="grid" id="grid"></main>
<footer><span id="hint"></span> Mockup only. File lists below are samples (HopCast's come from release v0.1.15; the others are guesses from READMEs). Hardware detection and downloads are simulated.</footer>

<script>
/* Sample release file names. The real launcher reads these from each repo's latest GitHub release. */
const RELEASES = {
  "Alias Maker": ["Alias-Maker-1.0-x86_64.AppImage"],
  "Anti-Social": ["Anti-Social-Setup-0.22.0.exe","Anti-Social-0.22.0-portable.exe","Anti-Social-0.22.0.AppImage","Anti-Social-0.22.0.deb","Anti-Social-0.22.0.apk"],
  "HopCast": ["HopCast-release-0.1.15-x86_64.AppImage","HopCast-debug-0.1.15-x86_64.AppImage","hopcast-source-0.1.15.tar.gz","hopcast-bin-aur-0.1.15.tar.gz","hopcast-flatpak-0.1.15.tar.gz","SHA256SUMS","HopCast-windows-x64-0.1.15.zip","SHA256SUMS-windows","HopCast-android-0.1.15.apk","SHA256SUMS-android","hopcast-fdroid-0.1.15.tar.gz"],
  "HopTunes": ["HopTunes-1.0-x86_64.AppImage"],
  "sudo make art": ["sudo-make-art-x86_64.AppImage","sudo-make-art-Setup.exe","sudo-make-art-portable.exe","sudo-make-art-android.apk"],
  "sudo make music": ["sudo-make-music-x86_64.AppImage","sudo-make-music-portable.exe","sudo-make-music-windows-folder.zip","sudo-make-music-android.apk"],
};
const UNTESTED = {"sudo make art":["windows","android"], "sudo make music":["windows","android"]};
const DEV = {
  windows:{name:"Windows PC", spec:"x86_64 · 16 GB RAM · discrete GPU", os:"windows", arch:"x86_64"},
  linux:{name:"Linux PC", spec:"x86_64 · 32 GB RAM · discrete GPU", os:"linux", arch:"x86_64"},
  android:{name:"Android phone", spec:"arm64 · 8 GB RAM", os:"android", arch:"aarch64"},
  arm:{name:"Linux ARM board", spec:"aarch64 · 4 GB RAM", os:"linux", arch:"aarch64"},
};
const KIND = {appimage:"AppImage", deb:".deb", rpm:".rpm", installer:"Installer", msi:"MSI", portable:"Portable", exe:".exe", zip:"Zip", apk:"APK"};
const RANK = {appimage:0, deb:1, rpm:2, installer:0, msi:1, portable:2, exe:3, zip:4, apk:0};

/* The sorting rules. Anything that is not clearly a build for an OS is ignored. */
function classify(file) {
  const f = file.toLowerCase();
  if (/sha256|\.sig$|\.asc$|\.txt$|\.tar\.gz$|debug/.test(f)) return null;   // checksums, source, packaging, debug
  let os, kind;
  if (f.endsWith(".appimage")) { os = "linux"; kind = "appimage"; }
  else if (f.endsWith(".deb")) { os = "linux"; kind = "deb"; }
  else if (f.endsWith(".rpm")) { os = "linux"; kind = "rpm"; }
  else if (f.endsWith(".apk")) { os = "android"; kind = "apk"; }
  else if (f.endsWith(".msi")) { os = "windows"; kind = "msi"; }
  else if (f.endsWith(".exe")) { os = "windows"; kind = /setup|install/.test(f) ? "installer" : /portable/.test(f) ? "portable" : "exe"; }
  else if (f.endsWith(".zip") && /win/.test(f)) { os = "windows"; kind = "zip"; }
  else return null;
  const arch = /aarch64|arm64/.test(f) ? "aarch64" : /x86_64|x64|amd64|win64/.test(f) ? "x86_64" : os === "android" ? "any" : "x86_64";
  return {file, os, kind, arch};
}
function variants(app, dev) {
  return RELEASES[app].map(classify)
    .filter((b) => b && b.os === dev.os && (b.arch === "any" || b.arch === dev.arch))
    .sort((a, b) => RANK[a.kind] - RANK[b.kind] || a.file.localeCompare(b.file));
}

const $ = (id) => document.getElementById(id);
var root = document.documentElement;
function render() {
  const d = DEV[$("dev").value];
  $("devname").textContent = "Detected: " + d.name;
  $("devspec").textContent = d.spec;
  const apps = Object.keys(RELEASES).sort((a, b) => a.localeCompare(b));
  $("devnote").textContent = apps.filter((a) => variants(a, d).length).length + " of " + apps.length + " apps have a build for this device";
  $("grid").replaceChildren(...apps.map((name) => {
    const v = variants(name, d), t = document.createElement("section");
    t.className = "tile";
    t.innerHTML = `<div><h2></h2><div class="tag"></div></div><div class="row"><select aria-label="Version"></select><button class="go"></button></div>`;
    t.querySelector("h2").textContent = name;
    t.querySelector(".tag").textContent = TAGLINE[name];
    const sel = t.querySelector("select"), btn = t.querySelector(".go");
    if (v.length) {
      const untested = (UNTESTED[name] || []).includes(d.os) ? " · untested" : "";
      v.forEach((b, i) => sel.add(new Option((i === 0 ? "Recommended: " : "") + KIND[b.kind] + untested)));
      btn.textContent = "Install";
    } else {
      sel.add(new Option("No " + d.name.split(" ")[0] + " build yet"));
      sel.disabled = true; btn.textContent = "Unavailable"; btn.disabled = true; t.classList.add("off");
    }
    return t;
  }));
}
const TAGLINE = {"Alias Maker":"Mario Maker for terminal commands","Anti-Social":"Social media where nobody sees your posts","HopCast":"Bloat-free, easy livestreaming","HopTunes":"Sleek, minimalist media player","sudo make art":"Offline, local-only design tool","sudo make music":"Offline AI music generation"};
$("dev").onchange = render;
$("theme").onchange = (e) => { root.dataset.theme = e.target.value; if (!localStorage_has()) syncPicker(); checkContrast(); };
render();

/* ---------- Accent picker ---------- */
function lum(hex) {
  const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map((v) => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)));
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
function ratio(a, b) { const [x, y] = [lum(a), lum(b)].sort((m, n) => n - m); return (x + 0.05) / (y + 0.05); }
function toHex(rgb) { return "#" + rgb.match(/\d+/g).slice(0, 3).map((n) => (+n).toString(16).padStart(2, "0")).join(""); }
function checkContrast() {
  const accent = getComputedStyle(root).getPropertyValue("--accent").trim();
  const bg = toHex(getComputedStyle(document.body).backgroundColor);
  $("hint").textContent = ratio(accent, bg) < 3 ? "This accent is hard to see on this theme. Try a lighter or darker colour." : "";
}
function setAccent(hex, save) {
  root.style.setProperty("--accent", hex);
  root.style.setProperty("--accent-ink", lum(hex) > 0.4 ? "#00141a" : "#ffffff");
  $("accent").value = hex;
  if (save) { try { localStorage.setItem("accent", hex); } catch (e) {} }
  checkContrast();
}
function resetAccent() {
  root.style.removeProperty("--accent"); root.style.removeProperty("--accent-ink");
  try { localStorage.removeItem("accent"); } catch (e) {}
  syncPicker(); checkContrast();
}
$("accent").oninput = (e) => setAccent(e.target.value, true);
$("reset").onclick = resetAccent;
try { const saved = localStorage.getItem("accent"); if (saved) setAccent(saved, false); } catch (e) {}
checkContrast();

function localStorage_has() { try { return !!localStorage.getItem("accent"); } catch (e) { return false; } }
function syncPicker() { const v = getComputedStyle(root).getPropertyValue("--accent").trim(); if (/^#[0-9a-f]{6}$/i.test(v)) $("accent").value = v; }
</script>
</body>
</html>
