<!doctype html>
<html lang="en" data-theme="cyberpunk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hopper Launcher: design mockup</title>
<style>
/* ---------- Themes: every colour in the UI comes from these tokens ---------- */
:root, [data-theme="cyberpunk"] {
  --bg: #0d0f1a; --panel: #151829; --panel-hi: #1b1f35; --line: #2a2f4d;
  --text: #e6e9ff; --dim: #9aa2c8; --accent: #19e3ff; --accent-ink: #00141a;
  --warn: #ffb02e; --ok: #2ee6a6;
}
[data-theme="midnight"] {
  --bg: #10151c; --panel: #171e28; --panel-hi: #1d2633; --line: #2b3646;
  --text: #e8edf3; --dim: #9aa8b8; --accent: #6ea8fe; --accent-ink: #06121f;
  --warn: #f0b84a; --ok: #5fd39a;
}
[data-theme="paper"] {
  --bg: #f4f1ea; --panel: #fffdf8; --panel-hi: #f0ece2; --line: #d8d2c4;
  --text: #1b1b1f; --dim: #5d5b57; --accent: #0b6e8a; --accent-ink: #ffffff;
  --warn: #9a5b00; --ok: #17724f;
}

/* ---------- Layout: one 8px grid, nothing off-grid, nothing moves ---------- */
* { box-sizing: border-box; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/24px system-ui, "Segoe UI", sans-serif;
  padding: 32px; max-width: 1120px; margin: 0 auto;
}
header { display: flex; justify-content: space-between; align-items: center; height: 64px; }
h1 { font-size: 32px; line-height: 40px; font-weight: 300; letter-spacing: 2px; text-transform: lowercase; }
h1 b { font-weight: 700; color: var(--accent); }
.controls { display: flex; gap: 16px; }
label { font-size: 12px; line-height: 16px; color: var(--dim); display: block; text-transform: uppercase; letter-spacing: 1px; }
select, button {
  font: inherit; font-size: 14px; height: 40px; padding: 0 16px;
  background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 4px;
}
select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.device {
  margin: 24px 0; padding: 16px 24px; height: 72px;
  background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent);
  border-radius: 4px; display: flex; justify-content: space-between; align-items: center;
}
.device strong { display: block; }
.device span { color: var(--dim); font-size: 14px; }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 880px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .grid { grid-template-columns: 1fr; } body { padding: 16px; } }

.tile {
  height: 208px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between;
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
}
.tile:hover { background: var(--panel-hi); }
.tile h2 { font-size: 20px; line-height: 24px; font-weight: 600; }
.tile .tag { color: var(--dim); font-size: 14px; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { display: inline-block; font-size: 12px; line-height: 16px; padding: 4px 8px; border: 1px solid currentColor; border-radius: 2px; }
.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.no { color: var(--dim); }
.row { display: flex; flex-direction: column; align-items: stretch; gap: 16px; }
.row .chip { align-self: flex-start; white-space: nowrap; }
.go { background: var(--accent); color: var(--accent-ink); border: 0; font-weight: 600; width: 100%; }
.go[disabled] { background: transparent; color: var(--dim); border: 1px solid var(--line); font-weight: 400; }
footer { margin-top: 24px; color: var(--dim); font-size: 12px; line-height: 16px; height: 16px; }

/* Cyberpunk flavour without noise: a single thin accent line, no glow or flicker. */
[data-theme="cyberpunk"] header { border-bottom: 1px solid var(--accent); }
@media (prefers-reduced-motion: no-preference) { .tile, .go { transition: background .15s; } }
</style>
</head>
<body>
<header>
  <h1>hopper<b>launcher</b></h1>
  <div class="controls">
    <div><label for="theme">Theme</label>
      <select id="theme"><option value="cyberpunk">Cyberpunk</option><option value="midnight">Midnight</option><option value="paper">Paper (light)</option></select></div>
    <div><label for="dev">Simulate device</label>
      <select id="dev"><option value="windows">Windows PC</option><option value="linux" selected>Linux PC</option><option value="android">Android phone</option><option value="arm">Linux ARM board</option></select></div>
  </div>
</header>

<section class="device" aria-live="polite"><div><strong id="devname"></strong><span id="devspec"></span></div><span id="devnote"></span></section>
<main class="grid" id="grid"></main>
<footer>Mockup only. Hardware detection and downloads are simulated here. Apps are listed alphabetically and the layout never reorders itself.</footer>

<script>
const APPS = [
  {n:"Alias Maker", t:"Mario Maker for terminal commands", b:[["linux","x86_64","AppImage"]]},
  {n:"Anti-Social", t:"Social media where nobody sees your posts", b:[["linux","x86_64","AppImage"],["windows","x86_64","Installer"],["android","any","APK"]]},
  {n:"HopCast", t:"Bloat-free, easy livestreaming", b:[["linux","x86_64","AppImage"],["windows","x86_64","Installer"],["android","any","APK",2]]},
  {n:"HopTunes", t:"Sleek, minimalist media player", b:[["linux","x86_64","AppImage"],["android","any","APK",2]]},
  {n:"sudo make art", t:"Offline, local-only design tool", b:[["linux","x86_64","AppImage"],["windows","x86_64","Installer",1],["android","any","APK",1]]},
  {n:"sudo make music", t:"Offline AI music generation", b:[["linux","x86_64","AppImage"],["windows","x86_64","Portable",1],["android","any","APK",1]]},
];
const DEV = {
  windows:{name:"Windows PC", spec:"x86_64 · 16 GB RAM · discrete GPU", os:"windows", arch:"x86_64"},
  linux:{name:"Linux PC", spec:"x86_64 · 32 GB RAM · discrete GPU", os:"linux", arch:"x86_64"},
  android:{name:"Android phone", spec:"arm64 · 8 GB RAM", os:"android", arch:"arm64"},
  arm:{name:"Linux ARM board", spec:"aarch64 · 4 GB RAM", os:"linux", arch:"aarch64"},
};
const $ = (id) => document.getElementById(id);
function pick(app, d) {
  return app.b.find(([os, arch]) => os === d.os && (arch === "any" || arch === d.arch));
}
function render() {
  const d = DEV[$("dev").value];
  $("devname").textContent = "Detected: " + d.name;
  $("devspec").textContent = d.spec;
  const n = APPS.filter((a) => { const m = pick(a, d); return m && m[3] !== 2; }).length;
  $("devnote").textContent = n + " of " + APPS.length + " apps have a build for this device";
  $("grid").replaceChildren(...APPS.map((a) => {
    const m = pick(a, d), t = document.createElement("section");
    t.className = "tile";
    const planned = m && m[3] === 2;
    const status = planned ? ["no", "Coming soon"] : m ? (m[3] ? ["warn", "Build available (untested)"] : ["ok", "Recommended: " + m[2]])
                     : ["no", "Not available for " + d.name.split(" ")[0] + " yet"];
    t.innerHTML = `<div><h2></h2><div class="tag"></div></div><div class="row"><span class="chip ${status[0]}"></span><button class="go"></button></div>`;
    t.querySelector("h2").textContent = a.n;
    t.querySelector(".tag").textContent = a.t;
    t.querySelector(".chip").textContent = status[1];
    const btn = t.querySelector(".go");
    btn.textContent = planned ? "Coming soon" : m ? "Install" : "Unavailable";
    btn.disabled = !m || planned;
    return t;
  }));
}
$("dev").onchange = render;
$("theme").onchange = (e) => { document.documentElement.dataset.theme = e.target.value; };
render();
</script>
</body>
</html>
