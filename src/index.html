<!doctype html>
<html lang="en" data-theme="cyberpunk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hopper Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>hopper<b>launcher</b></h1>
    <div class="controls">
      <div><label for="theme">Theme</label>
        <select id="theme"><option value="cyberpunk">Cyberpunk</option><option value="midnight">Midnight</option><option value="paper">Paper (light)</option></select></div>
      <div><label for="accent">Accent</label>
        <div class="pair"><input type="color" id="accent" value="#19e3ff" aria-label="Accent colour"><button id="reset" type="button">Reset</button></div></div>
      <div><label>&nbsp;</label><div class="pair"><button id="refresh" type="button">Check for updates</button><button id="open-settings" type="button">Settings</button></div></div>
    </div>
  </header>

  <section class="device" aria-live="polite"><div><strong id="devname">Detecting…</strong><span id="devspec"></span></div><span id="devnote"></span></section>
  <main class="grid" id="grid"></main>
  <footer><span id="msg"></span><span id="hint"></span></footer>
  <dialog id="settings" aria-labelledby="settings-title"></dialog>
  <script src="main.js"></script>
</body>
</html>
